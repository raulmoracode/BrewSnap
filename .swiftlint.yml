# .swiftlint.yml
# BrewSnap — SwiftLint config (Swift 6, macOS 15+)

disabled_rules:
  - trailing_whitespace
  - line_length

opt_in_rules:
  - empty_count
  - closure_spacing
  - empty_string
  - first_where
  - sorted_first_last

included:
  - BrewSnap

excluded:
  - DerivedData
  - .build

line_length:
  warning: 120
  error: 150

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 500

function_body_length:
  warning: 50
  error: 80

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - url

force_unwrapping:
  severity: error

force_cast:
  severity: error

force_try:
  severity: warning
